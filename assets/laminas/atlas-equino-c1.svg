<ellipse class="surface" cx="611" cy="420" rx="28" ry="14" transform="rotate(-22 611 420)"/>
<ellipse class="surface" cx="500" cy="224" rx="17" ry="10"/>
<circle class="hole" cx="342" cy="302" r="10"/>
<circle class="hole" cx="658" cy="302" r="10"/>
<!-- Numeración dorsal -->
<g class="n"><circle cx="500" cy="195" r="18"/><text x="500" y="195">1</text></g>
<g class="n"><circle cx="500" cy="242" r="18"/><text x="500" y="242">2</text></g>
<g class="n"><circle cx="305" cy="370" r="18"/><text x="305" y="370">3</text></g>
<g class="n"><circle cx="386" cy="274" r="18"/><text x="386" y="274">4</text></g>
<g class="n"><circle cx="610" cy="431" r="18"/><text x="610" y="431">5</text></g>
<g class="n"><circle cx="120" cy="365" r="18"/><text x="120" y="365">6</text></g>
<g class="n"><circle cx="340" cy="328" r="18"/><text x="340" y="328">7</text></g>
<text x="62" y="555" class="small">El foramen vertebral ocupa el centro del anillo óseo; las alas son procesos transversos muy expandidos.</text>

<rect x="32" y="615" width="936" height="490" rx="22" class="panel"/>
<text x="62" y="655" class="view">B. Vista ventral · orientación craneal ↑</text>
