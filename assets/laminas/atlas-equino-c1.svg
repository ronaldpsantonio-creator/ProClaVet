<ellipse class="hole" cx="315" cy="805" rx="13" ry="18"/>
<ellipse class="hole" cx="685" cy="805" rx="13" ry="18"/>
<ellipse class="hole" cx="315" cy="910" rx="13" ry="18"/>
<ellipse class="hole" cx="685" cy="910" rx="13" ry="18"/>
<g class="n"><circle cx="500" cy="950" r="18"/><text x="500" y="950">8</text></g>
<g class="n"><circle cx="500" cy="985" r="18"/><text x="500" y="985">9</text></g>
<g class="n"><circle cx="180" cy="842" r="18"/><text x="180" y="842">10</text></g>
<g class="n"><circle cx="315" cy="777" r="18"/><text x="315" y="777">11</text></g>
<g class="n"><circle cx="315" cy="940" r="18"/><text x="315" y="940">12</text></g>
<!-- Inset fovea dentis -->
<rect x="720" y="920" width="220" height="150" rx="14" fill="#f7f8f6" stroke="#d8dee4" stroke-width="2"/>
<text x="735" y="948" class="small" font-weight="700">Detalle interno</text>
<path class="bone" d="M760 1005 Q830 970 900 1005 L887 1038 Q830 1018 773 1038 Z"/>
<ellipse class="depression" cx="830" cy="1006" rx="34" ry="13"/>
<g class="n"><circle cx="910" cy="990" r="18"/><text x="910" y="990">13</text></g>
<text x="62" y="1078" class="small">Los forámenes se representan de forma topográfica; su comunicación exacta debe contrastarse en la preparación individual.</text>

<rect x="32" y="1125" width="936" height="390" rx="22" class="panel"/>
<text x="62" y="1167" class="view">Identificación de accidentes anatómicos</text>
<text x="62" y="1210" class="key">1. Arco dorsal · <tspan font-style="italic">arcus dorsalis</tspan></text>
<text x="62" y="1246" class="key">2. Tubérculo dorsal · <tspan font-style="italic">tuberculum dorsale</tspan></text>
<text x="62" y="1282" class="key">3. Masas laterales · <tspan font-style="italic">massae laterales</tspan></text>
<text x="62" y="1318" class="key">4. Fóveas articulares craneales · <tspan font-style="italic">foveae articulares craniales</tspan></text>
<text x="62" y="1354" class="key">5. Fóveas articulares caudales · <tspan font-style="italic">foveae articulares caudales</tspan></text>
<text x="62" y="1390" class="key">6. Alas del atlas · <tspan font-style="italic">alae atlantis</tspan></text>
<text x="62" y="1426" class="key">7. Foramen vertebral lateral · <tspan font-style="italic">foramen vertebrale laterale</tspan></text>
<text x="520" y="1210" class="key">8. Arco ventral · <tspan font-style="italic">arcus ventralis</tspan></text>
<text x="520" y="1246" class="key">9. Tubérculo ventral · <tspan font-style="italic">tuberculum ventrale</tspan></text>
<text x="520" y="1282" class="key">10. Fosa del atlas · <tspan font-style="italic">fossa atlantis</tspan></text>
<text x="520" y="1318" class="key">11. Foramen alar · <tspan font-style="italic">foramen alare</tspan></text>
<text x="520" y="1354" class="key">12. Foramen transverso · <tspan font-style="italic">foramen transversarium</tspan></text>
<text x="520" y="1390" class="key">13. Fóvea del diente · <tspan font-style="italic">fovea dentis</tspan></text>
<text x="62" y="1480" class="small">Esquema didáctico bidimensional, no a escala. No sustituye una preparación anatómica ni un modelo 3D validado.</text>
</svg>